<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect
    var pathSegments = window.location.pathname.split('/').filter(Boolean);
    var repo = pathSegments[0] || 'my-assets';
    // Redirect cleanly to the root app retaining search and hash
    window.location.replace('/' + repo + '/' + window.location.search + window.location.hash);
  </script>
</head>
<body style="background: #09090b; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p>Loading My Assets Dashboard...</p>
</body>
</html>
